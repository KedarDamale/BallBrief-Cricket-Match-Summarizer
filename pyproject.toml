[project]
name = "BallBrief-Cricket-Match-Summarizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kedar Damale", email = "damalekedar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.1",
    "ipykernel>=7.4.0",
    "playwright>=1.63.0",
]

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
cricket-match-summarizer = "cricket_match_summarizer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
